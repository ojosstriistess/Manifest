<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080707">
  <meta name="description" content="MANIFEST — La oscuridad aguarda. 18 de diciembre.">
  <title>MANIFEST — 18 de diciembre</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=UnifrakturCook:wght@700&display=swap');
    :root { --blood:#8e1019; --blood-bright:#c21e2b; --paper:#d7d0ca; --muted:#8b8180; --black:#080707; }
    * { box-sizing:border-box; }
    html { min-height:100%; scroll-behavior:smooth; }
    body {
      margin:0; min-height:100vh; color:var(--paper); background:
      radial-gradient(ellipse at 50% 38%, rgba(80,8,15,.24), transparent 46%),
      radial-gradient(ellipse at 50% 100%, rgba(100,8,15,.13), transparent 50%), var(--black);
      font-family:'Cinzel', Georgia, serif; overflow-x:hidden; display:flex; flex-direction:column;
    }
    body::before {
      content:""; position:fixed; inset:0; pointer-events:none; opacity:.14; z-index:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.23'/%3E%3C/svg%3E");
    }
    .frame { position:fixed; inset:17px; border:1px solid rgba(155,119,113,.28); pointer-events:none; z-index:3; }
    .frame::before,.frame::after { content:"✦"; position:absolute; color:#75202a; font-size:16px; top:-10px; }
    .frame::before { left:-7px; } .frame::after { right:-7px; }
    main { width:min(920px,100%); margin:auto; padding:52px 24px 34px; text-align:center; position:relative; z-index:1; }
    .eyebrow { letter-spacing:.42em; text-transform:uppercase; font-size:10px; color:#b7a6a2; margin:0 0 18px; }
    .logo-wrap { width:min(490px,82vw); margin:0 auto 4px; position:relative; }
    .logo-wrap::after { content:""; position:absolute; inset:12% 10%; background:rgba(128,0,15,.12); filter:blur(32px); z-index:-1; }
    .logo { display:block; width:100%; height:auto; filter:drop-shadow(0 0 15px rgba(255,255,255,.14)); }
    .tagline { font-family:'UnifrakturCook',serif; font-size:clamp(24px,4vw,36px); color:#b51b27; margin:3px 0 28px; letter-spacing:.03em; text-shadow:0 0 18px rgba(151,0,20,.32); }
    .rule { display:flex; align-items:center; gap:16px; width:min(460px,85%); margin:0 auto 20px; color:#8d2029; }
    .rule::before,.rule::after { content:""; height:1px; flex:1; background:linear-gradient(90deg,transparent,#67232a); }
    .rule::after { transform:scaleX(-1); }
    .date-label { color:#b6a5a0; font-size:11px; letter-spacing:.34em; text-transform:uppercase; margin-bottom:20px; }
    .countdown { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:clamp(8px,2vw,18px); width:min(610px,100%); margin:0 auto; }
    .unit { border:1px solid rgba(139,35,43,.52); background:linear-gradient(155deg,rgba(35,13,15,.72),rgba(10,8,8,.8)); padding:20px 8px 17px; position:relative; box-shadow:inset 0 0 22px rgba(92,0,12,.08), 0 8px 25px #0005; }
    .unit::before { content:""; position:absolute; top:-1px; left:25%; right:25%; height:1px; background:#a51b27; box-shadow:0 0 9px #a51b27; }
    .number { display:block; font-size:clamp(30px,6vw,53px); font-weight:500; line-height:1.1; color:#eee5df; font-variant-numeric:tabular-nums; text-shadow:0 0 17px rgba(153,15,27,.22); }
    .unit-label { display:block; font-size:9px; letter-spacing:.23em; text-transform:uppercase; color:#a58e8b; margin-top:11px; }
    .message { min-height:20px; margin:23px 0 0; font-size:10px; letter-spacing:.2em; color:#a58b88; text-transform:uppercase; }
    footer { position:relative; z-index:1; text-align:center; padding:12px 20px 30px; color:#655957; font-size:9px; letter-spacing:.24em; text-transform:uppercase; }
    .sigil { color:#6e1b24; margin:0 8px; }
    @media(max-width:480px) {
      main { padding-top:45px; }
      .eyebrow { letter-spacing:.25em; font-size:9px; }
      .unit { padding:17px 3px 14px; }
      .unit-label { letter-spacing:.1em; font-size:8px; }
      .date-label { letter-spacing:.2em; font-size:10px; }
      .frame { inset:9px; }
    }
    @media(prefers-reduced-motion:no-preference) {
      .logo-wrap { animation:fadeIn 1.4s ease both; }
      .unit { animation:rise .8s ease both; }
      .unit:nth-child(2) { animation-delay:.08s; } .unit:nth-child(3) { animation-delay:.16s; } .unit:nth-child(4) { animation-delay:.24s; }
      @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
      @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    }
  </style>
</head>
<body>
  <div class="frame" aria-hidden="true"></div>
  <main>
    <p class="eyebrow">Una nueva era está por despertar</p>
    <div class="logo-wrap">
      <img class="logo" src="manifest-logo.png" alt="Logotipo gótico de MANIFEST">
    </div>
    <h1 class="tagline">MANIFEST</h1>
    <div class="rule" aria-hidden="true">✧</div>
    <section class="countdown" aria-label="Cuenta regresiva">
      <div class="unit"><span class="number" id="days">00</span><span class="unit-label">Días</span></div>
      <div class="unit"><span class="number" id="hours">00</span><span class="unit-label">Horas</span></div>
      <div class="unit"><span class="number" id="minutes">00</span><span class="unit-label">Minutos</span></div>
      <div class="unit"><span class="number" id="seconds">00</span><span class="unit-label">Segundos</span></div>
    </section>
    <p class="message" id="message">El silencio terminará pronto</p>
  </main>
  <footer><span class="sigil">✦</span> Lo que yace en la oscuridad, será revelado <span class="sigil">✦</span></footer>
  <script>
    // Cuenta regresiva hasta el 18 de diciembre de 2026 a las 00:00, hora de México central.
    const target = new Date('2026-12-18T00:00:00-06:00').getTime();
    const pad = n => String(n).padStart(2, '0');
    function updateCountdown() {
      let diff = target - Date.now();
      if (diff <= 0) {
        ['days','hours','minutes','seconds'].forEach(id => document.getElementById(id).textContent = '00');
        document.getElementById('message').textContent = 'MANIFEST HA DESPERTADO';
        return;
      }
      const days = Math.floor(diff / 86400000); diff %= 86400000;
      const hours = Math.floor(diff / 3600000); diff %= 3600000;
      const minutes = Math.floor(diff / 60000); diff %= 60000;
      const seconds = Math.floor(diff / 1000);
      document.getElementById('days').textContent = pad(days);
      document.getElementById('hours').textContent = pad(hours);
      document.getElementById('minutes').textContent = pad(minutes);
      document.getElementById('seconds').textContent = pad(seconds);
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
